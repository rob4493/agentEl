[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_BETA_ENABLED = "true"

# Set VITE_API_BASE_URL in Netlify's build environment, never a bearer code.
# The browser calls the tunnel directly; no 26-second Netlify /api proxy.
# Block preview/branch deployments from silently using production beta access.
[context.deploy-preview.environment]
  VITE_API_BASE_URL = ""

[context.branch-deploy.environment]
  VITE_API_BASE_URL = ""
